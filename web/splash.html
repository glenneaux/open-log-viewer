<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TS Log Viewer</title>
<!--
  Startup splash for the desktop build.

  The main window is created hidden (tauri.conf.json -> visible:false) because
  WebView2 paints a blank white surface for the fraction of a second it takes
  to parse index.html (~20k lines) and run its inline boot script. This tiny
  page is a second Tauri window shown immediately in its place; the Rust host
  closes it and reveals the main window once the frontend calls the
  `frontend_ready` command (see tauri-bridge.js).

  Self-contained on purpose: no CDN, no JS, nothing that could itself be slow.
-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1e1e1e; color: #d4d4d4;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  body {
    box-sizing: border-box;
    border: 1px solid #3f3f46;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
  }
  .logo { width: 52px; height: 52px; object-fit: contain; }
  .title { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: .2px; }
  .msg { font-size: 11.5px; color: #858585; }
  .bar {
    width: 190px; height: 3px; margin-top: 4px; border-radius: 2px;
    background: #2d2d30; overflow: hidden;
  }
  .bar span {
    display: block; width: 40%; height: 100%; border-radius: 2px;
    background: #0e639c;
    animation: slide 1.15s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-105%); }
    100% { transform: translateX(255%); }
  }
</style>
</head>
<body>
  <img class="logo" src="ts-logo-icon.png" alt="" />
  <div class="title">TS Log Viewer</div>
  <div class="msg">Loading…</div>
  <div class="bar"><span></span></div>
</body>
</html>
